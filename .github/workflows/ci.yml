name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only the latest run per branch/PR matters; cancel superseded runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: Credential & content guard (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - run: pip install -e "backend[dev]"
      - name: Fail if credentials/content could be persisted or logged
        working-directory: backend
        run: pytest tests/guard -v

  backend:
    name: Backend (ruff, mypy, pytest on SQLite + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sandroid
          POSTGRES_PASSWORD: sandroid
          POSTGRES_DB: sandroid_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sandroid" --health-interval 3s --health-retries 20
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          {
            python-version: "3.14",
            cache: pip,
            cache-dependency-path: backend/pyproject.toml,
          }
      - run: pip install -e ".[dev]"
      - run: ruff check app tests alembic
      - run: ruff format --check app tests alembic
      - run: mypy app
      - name: pytest (SQLite)
        run: pytest -q
      - name: Alembic migrations on Postgres (up → down → up)
        env:
          DATABASE_URL: postgresql+asyncpg://sandroid:sandroid@localhost:5432/sandroid_test
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head && alembic downgrade base
      - name: pytest (Postgres)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://sandroid:sandroid@localhost:5432/sandroid_test
        run: pytest -q tests/integration

  frontend:
    name: Frontend (tsc, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 24,
            cache: npm,
            cache-dependency-path: frontend/package-lock.json,
          }
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [guard]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
