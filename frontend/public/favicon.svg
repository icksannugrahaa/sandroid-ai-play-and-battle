<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Sandroid">
  <defs>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="blueGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="blueGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="blueGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Rounded dark tile, matching the app surface -->
  <rect x="0" y="0" width="256" height="256" rx="58" fill="#0f172a" />

  <!--
    Artwork in its native coordinate space (local bbox x:190 y:105 w:220 h:383).
    Centered in the tile and fitted to ~88% of its height: scale = 0.88*256/383 = 0.588.
    tx = 128 - 0.588*(190 + 220/2) = -48.4 ; ty = 128 - 0.588*(105 + 383/2) = -46.3
  -->
  <g filter="url(#dropShadow)" transform="translate(-48.4, -46.3) scale(0.588)">
    <line x1="235" y1="145" x2="212" y2="105" stroke="url(#headGrad)" stroke-width="12" stroke-linecap="round" />
    <line x1="365" y1="145" x2="388" y2="105" stroke="url(#headGrad)" stroke-width="12" stroke-linecap="round" />
    <path d="M 190 230 A 110 105 0 0 1 410 230 Z" fill="url(#headGrad)" />
    <circle cx="250" cy="188" r="11" fill="#0f172a" />
    <circle cx="350" cy="188" r="11" fill="#0f172a" />
    <path d="M 190 246 L 265 246 L 306 330 A 14 14 0 0 1 286 348 L 190 296 Z" fill="url(#blueGrad1)" />
    <path d="M 190 246 L 265 246 L 245 296 L 190 296 Z" fill="#bae6fd" fill-opacity="0.28" />
    <path d="M 358 246 L 410 246 L 410 298 C 380 298 358 276 358 246 Z" fill="url(#silverGrad)" />
    <path d="M 318 292 L 402 344 A 18 18 0 0 1 410 359 L 410 412 C 410 436 392 465 355 488 L 352 430 L 300 310 A 14 14 0 0 1 318 292 Z" fill="url(#blueGrad2)" />
    <path d="M 318 292 L 402 344 A 18 18 0 0 1 410 359 L 335 390 L 300 310 A 14 14 0 0 1 318 292 Z" fill="#7dd3fc" fill-opacity="0.25" />
    <path d="M 190 362 C 228 362 244 392 244 422 L 190 478 Z" fill="url(#silverGrad)" />
    <path d="M 248 430 L 332 430 C 344 430 348 440 348 460 C 348 478 340 488 326 488 L 196 488 Z" fill="url(#blueGrad3)" />
  </g>
</svg>
