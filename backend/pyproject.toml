[project]
name = "sandroid-ai-play-and-battle"
version = "1.0.0"
description = "Playground, Arena, Leaderboard & Pricing for any OpenAI-compatible endpoint. Never stores credentials."
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "httpx>=0.28",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "sqlalchemy[asyncio]>=2.0.43",
    "asyncpg>=0.30",
    "alembic>=1.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "aiosqlite>=0.21",
    "ruff>=0.13",
    "mypy>=1.18",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "S", "SIM", "RUF"]
ignore = ["S101", "S311", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "BLE"]
"alembic/**" = ["E501"]
"scripts/mock_provider.py" = ["E501"]  # fixture content (minified game code)

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "tests/"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true
